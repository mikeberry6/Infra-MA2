verlayOpacity":null,"titleVariant":null,"heroTypename":"HeroSecondaryTertiaryHero"},"category":{"__typename":"ContentArticleCategory","entryTitle":"Firm News"},"openContainerCollection":{"items":[{"__typename":"ModuleRte","sys":{"id":"3pMMtHJSW58euk45cLrhsh","__typename":"Sys"}}],"__typename":"ContentArticleOpenContainerCollection"},"bylineFeatures":null,"relatedArticlesCollection":{"items":[],"__typename":"ContentArticleRelatedArticlesCollection"},"addDynamicContent":null,"relatedArticlesHeadline":null,"bylineNewTab":null,"metaTitle":null,"metaDescription":null,"keywords":null,"noIndexNoFollow":null},"openContainerData":[{"props":{"sys":{"id":"3pMMtHJSW58euk45cLrhsh","__typename":"Sys"},"__typename":"ModuleRte","buttonsCollection":{"items":[],"__typename":"ModuleRteButtonsCollection"},"anchorId":null,"anchorTitle":null,"backgroundShape":null,"linksOpenInNewTab":null,"useLegacyRte":true,"legacyRte":"\u003cp\u003eHarris Williams \u0026amp; Co. announces the sale of United States Infrastructure Corporation (USIC), a portfolio company of Kohlberg \u0026amp; Company, L.L.C. (Kohlberg), to OMERS Private Equity. The transaction closed on May 14, 2010. Harris Williams \u0026amp; Co. acted as the exclusive advisor to USIC. The transaction was led by Ned Valentine, Mike Hogan, John Arendale and Eric Logue from the firm\u0026#39;s Richmond office.\u003c/p\u003e\r\n\u003cp\u003e\u0026quot;USIC is the market leader in the utility locating industry with a track record of high quality service, innovation, and growth, and is well positioned to benefit from increased spending on infrastructure projects in the U.S. as well as a rebound in overall construction activity. We look forward to watching the continued success of USIC through its partnership with OMERS Private Equity,\u0026quot; said Mike Hogan, managing director at Harris Williams \u0026amp; Co.\u003c/p\u003e\r\n\u003cp\u003eUSIC is the leading provider of outsourced sub-surface utility locating services in the U.S. The company provides locating services across 20 states on behalf of over 400 telecom, electric, gas, cable and water utilities, including all major national and regional utilities throughout the Midwest, Southeast, Southwest and Northwest.\u003c/p\u003e\r\n\u003cp\u003eKohlberg is a leading private equity firm that invests in middle market companies. Since its inception in 1987, Kohlberg has completed over 100 platform and add-on acquisitions, representing aggregate transaction value of over $6 billion, as a control investor in a variety of industries, including manufacturing, healthcare, consumer products and service industries.\u003c/p\u003e\r\n\u003cp\u003eOMERS Private Equity manages the private equity activities of OMERS, one of Canada\u0026#39;s largest pension funds, and today has over $4 billion of investments under management. The group\u0026#39;s investment strategy includes the active ownership of businesses in North America and Europe. OMERS Private Equity is headquartered in Toronto, Canada, with offices in New York and London.\u003c/p\u003e\r\n","rte":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Harris Williams \u0026 Co. announces the sale of United States Infrastructure Corporation (USIC), a portfolio company of Kohlberg \u0026 Company, L.L.C. (Kohlberg), to OMERS Private Equity. The transaction closed on May 14, 2010. Harris Williams \u0026 Co. acted as the exclusive advisor to USIC. The transaction was led by Ned Valentine, Mike Hogan, John Arendale and Eric Logue from the firm\u0026#39;s Richmond office.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"\u0026quot;USIC is the market leader in the utility locating industry with a track record of high quality service, innovation, and growth, and is well positioned to benefit from increased spending on infrastructure projects in the U.S. as well as a rebound in overall construction activity. We look forward to watching the continued success of USIC through its partnership with OMERS Private Equity,\u0026quot; said Mike Hogan, managing director at Harris Williams \u0026 Co.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"USIC is the leading provider of outsourced sub-surface utility locating services in the U.S. The company provides locating services across 20 states on behalf of over 400 telecom, electric, gas, cable and water utilities, including all major national and regional utilities throughout the Midwest, Southeast, Southwest and Northwest.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Kohlberg is a leading private equity firm that invests in middle market companies. Since its inception in 1987, Kohlberg has completed over 100 platform and add-on acquisitions, representing aggregate transaction value of over $6 billion, as a control investor in a variety of industries, including manufacturing, healthcare, consumer products and service industries.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"OMERS Private Equity manages the private equity activities of OMERS, one of Canada\u0026#39;s largest pension funds, and today has over $4 billion of investments under management. The group\u0026#39;s investment strategy includes the active ownership of businesses in North America and Europe. OMERS Private Equity is headquartered in Toronto, Canada, with offices in New York and London.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"},"__typename":"ModuleRteRte","links":{"__typename":"ModuleRteRteLinks","assets":{"__typename":"ModuleRteRteAssets","hyperlink":[],"block":[]},"entries":{"__typename":"ModuleRteRteEntries","hyperlink":[],"block":[]}}}}}],"openContainersContentTypes":["ModuleRte"],"navigationData":{"globalNavigationCollection":{"__typename":"GlobalNavigationCollection","items":[{"__typename":"GlobalNavigatio
