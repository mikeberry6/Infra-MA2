t;Company Description\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID203\u0026quot;\u0026gt;Our Base-Case Scenario\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID227\u0026quot;\u0026gt;Liquidity\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID234\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID273\u0026quot;\u0026gt;Covenants\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID280\u0026quot;\u0026gt;Environmental, Social, And Governance\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID287\u0026quot;\u0026gt;Issue Ratings--Recovery Analysis \u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID351\u0026quot;\u0026gt;Rating Component Scores\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID534\u0026quot;\u0026gt;Related Criteria\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID654\u0026quot;\u0026gt;Ratings List\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID768\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;/ul\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;/ul\u0026gt;\u0026lt;div class=\u0026quot;clear\u0026quot;\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;/div\u0026gt;\n      \u0026lt;a name=\u0026quot;ID90\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Rating Action Overview\u0026lt;/h4\u0026gt;\n        \u0026lt;ul\u0026gt;\n          \u0026lt;li\u0026gt;\n            Crescent Midstream Intermediate Holdings LLC (CMIH) intends to issue a $500 million senior secured term loan B (TLB) due 2033 and put in place a new $100 million revolving credit facility (RCF) due 2031, which will be pari passu. The company will use proceeds to repay outstanding debt at Crescent Midstream Holdings LLC (Holdings) and Crescent Midstream Operating LLC (Operating). At close, the company will have $16 million of the RCF drawn and there will be no debt outstanding at the Holdings and Operating levels.\u0026lt;/li\u0026gt;\n          \u0026lt;li\u0026gt;We assigned a 'B+' issuer credit rating to CMIH and a 'B+' issue-level rating to the proposed senior secured TLB with a recovery rating of '3'. The '3' recovery rating indicates our expectation of meaningful (50%-70%; rounded estimate: 60%) recovery in the event of a default.\u0026lt;/li\u0026gt;\n          \u0026lt;li\u0026gt;The stable outlook reflects our expectation that the company will generate stable cash flow and its S\u0026amp;amp;P Global Ratings-adjusted leverage will be 3.50x-3.75x in 2026 and about 3.00x in 2027.\u0026lt;/li\u0026gt;\n        \u0026lt;/ul\u0026gt;\n      \n      \u0026lt;a name=\u0026quot;ID113\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Rating Action Rationale \u0026lt;/h4\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;While the company has doubled in size since 2021, we believe its operating scale is relatively limited.\u0026amp;nbsp;\u0026lt;/span\u0026gt;Over the past few years, the company has taken a number of growth initiatives including the 2025 expansion in Cameron Highway Oil Pipeline System (CHOPS), which increased its capacity to 575,000 barrels per day (bpd) from 350,000 bpd. Through its wholly owned subsidiary, Crescent Midstream LLC (Crescent), the company holds a 36% equity interest in CHOPS.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;The majority of CMIH\u0026rsquo;s cash flows will rely on distributions from its joint venture (JV) affiliates. Despite this significant reliance on JV affiliates for cash flow generation, we forecast stable distributions throughout the outlook period and anticipate its consolidated S\u0026amp;amp;P Global Ratings-adjusted EBITDA will increase to $120 million-$125 million in 2026 and $130 million-$135 million in 2027. \u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;CMIH\u0026rsquo;s stable cash flows are backed by constructive contracts with high-quality counterparties.\u0026amp;nbsp;\u0026lt;/span\u0026gt;The majority of the company\u0026rsquo;s assets are life-of-lease contracted with deepwater wells that have production lives of 20-40 years, limiting its contract renewal risk. We estimate about 89 % of the company's cash flows are underpinned by fixed-fee contracts and about 75% are backed by long term life-of-lease dedication and minimum volume contracts, providing good cash flow visibility. Also, more than 75% of its cash flow is from investment-grade rated counterparties.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;CMIH benefits from its strategically located assets in the Gulf of Mexico despite some concentration risk.\u0026amp;nbsp;\u0026lt;/span\u0026gt;Through its three segments--CHOPS, Eastern Crescent Louisiana Integrated Pipeline System (ECLIPS), and Western Gulf Pipeline System (Western Gulf)--the company primarily transports crude oil from deepwater wells in Gulf of Mexico to refineries in Texas and Louisiana. We generally view volumes from deepwater wells favorably, given their low decline rates.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;The company also benefits from lower break-even prices in Gulf of Mexico compared with other basins. We believe the company is well positioned to secure volumes as there are limited alternative transportation routes in that region due to high infrastructure costs and regulatory hurdles. We also note the concentration in the Gulf of Mexico exposes the company to significant volumetric risks during hurricane downtime.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;CMIH\u0026rsquo;s assets are currently underutilized\u0026amp;nbsp;\u0026lt;/span\u0026gt;, with pipelines operating at 30%-50% of total capacity. Despite this relatively low utilization rate, the company\u0026rsquo;s excess capacity positions it to meet increased demand and potential growth in drilling activity within the region with limited incremental investment needed.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;CMIH has a clear path to deleverage over the next two years.\u0026amp;nbsp;\u0026lt;/span\u0026gt;The company's TLB is subject to a 75% excess cash flow (ECF) sweep if its leverage exceeds 4.0x, decreasing to 50% when leverage is 3.5x-4.0x, 25% when leverage is 2.0x-3.5x, and no cash sweep when it falls below 2x. We anticipate the company will generate at least $70 million of free operating cash flow (FOCF) in 2026 and 2027, supporting deleveraging. We forecast CMIH's S\u0026amp;amp;P Global Ratings-adjusted debt to EBITDA will deleverage from 3.50x-3.75x range in 2026 to around 3.00x in 2027.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;In addition, the anticipated FOCF and availability under its new RCF provide the company with financial flexibility for growth initiatives.\u0026lt;/p\u0026gt;\n      \n      \u0026lt;a name=\u0026quot;ID156\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Outlook\u0026lt;/h4\u0026gt;\n        \u0026lt;p\u0026gt;Our stable outlook on the company reflects the predictability and stability of the company's cash flows backed by a supportive contractual framework. We expect the company\u0026rsquo;s S\u0026amp;amp;P Global Ratings-adjusted leverage of 3.50x-3.75x in 2026 and in the 3.00x area in 2027.\u0026lt;/p\u0026gt;\n        \u0026lt;a name=\u0026quot;ID162\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Downside scenario\u0026lt;/h5\u0026gt;\n          \u0026lt;p\u0026gt;We could consider a negative rating action if we forecast the company will sustain S\u0026amp;amp;P Global Ratings-adjusted leverage above 4.5x. This could occur if:\u0026lt;/p\u0026gt;\n          \u0026lt;ul\u0026gt;\n            \u0026lt;li\u0026gt;The company generates lower-than-expected EBITDA generation due to lower volumes; or\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;The company makes lower-than-anticipated debt repayments.\u0026lt;/li\u0026gt;\n          \u0026lt;/ul\u0026gt;\n        \n        \u0026lt;a name=\u0026quot;ID179\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Upside scenario\u0026lt;/h5\u0026gt;\n          \u0026lt;p\u0026gt;Due to the company's limited scale and geographic diversity, we do not expect to take a positive rating action over the next 12 months. However, we could consider a positive rating action if it maintains S\u0026amp;amp;P Global Ratings-adjusted leverage of 3.0x-3.5x while expanding its operating scale and improving asset utilization.\u0026lt;/p\u0026gt;\n        \n      \n      \u0026lt;a name=\u0026quot;ID187\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Company Description\u0026lt;/h4\u0026gt;\n        \u0026lt;p\u0026gt;CMIH, through its affiliates, provides crude oil transportation services in Louisiana and the U.S. offshore regions of the Gulf of Mexico. CMIH is wholly owned by Holdings, which was formed in 2020 and is based in Louisiana. Holdings is 68% owned by The Carlyle Group and 32% by John Grier, founder of the company. CMIH, through its 100% ownership in Operating, wholly owns and controls Crescent. Including its investments in JV affiliates, Crescent has three segments including CHOPS, ECLIPS, and Western Gulf. \u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;CHOPS is 36% owned by Crescent and 64% owned and operated by Genesis Energy L.P. CHOPS consists of a 380-mile crude oil pipeline with 575,000 bpd capacity that interconnects with refineries and terminals in Port Arthur and Texas City. It delivers crude oil from major fields in the deepwater Gulf of America to refining markets along the Texas Gulf Coast. \u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;ECLIPS operates as a vertically integrated pipeline network extending from the eastern Gulf of America offshore to pipeline infrastructure onshore in Louisiana. It wholly owns and operates the Eastern Gulf Pipeline system. Through ECLIPS, Crescent also holds a 70% equity interest in and operates the Bonefish and Anchorage pipeline systems.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;Crescent holds 100% ownership in Western Gulf\u0026rsquo;s operated assets and minority stakes in certain nonoperated assets that connect to shore. Western Gulf consists of four wholly owned and operated pipeline systems totaling 340 miles and two nonoperated pipeline systems including White Cap and Ship Shoal. It connects offshore production in the Western Gulf to key Louisiana demand markets backed by dedications.\u0026lt;/p\u0026gt;\n      \n      \u0026lt;a name=\u0026quot;ID203\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Our Base-Case Scenario\u0026lt;/h4\u0026gt;\n        \u0026lt;a name=\u0026quot;ID206\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Assumptions\u0026lt;/h5\u0026gt;\n          \u0026lt;ul\u0026gt;\n            \u0026lt;li\u0026gt;West Texas Intermediate crude price of $55 per barrel (/bbl) for the remainder of 2026 and $60/bbl in 2027 and thereafter.\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;We treat the company\u0026rsquo;s noncontrolling equity interests in its JV affiliates under our equity method.\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Annual maintenance capital expenditures averaging $10 million-$15 million in 2026 and 2027.\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;After mandatory amortization and ECF sweeps, the company will make additional debt repayments to achieve leverage target.\u0026lt;/li\u0026gt;\n          \u0026lt;/ul\u0026gt;\n        \n      \n      \u0026lt;a name=\u0026quot;ID227\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Liquidity\u0026lt;/h4\u0026gt;\n        \u0026lt;p\u0026gt;Pro forma for the transaction, we assess the company\u0026rsquo;s liquidity as adequate, with sources exceeding uses by above 2.0x over the next 12 months. Although we typically view a ratio above 2.0x as commensurate with stronger assessment, we limit our assessment at adequate based on certain qualitative factors, including its limited track record of absorbing a high-impact, low-probability event without refinancing and lack of a high standing in the credit markets. Given the company's supportive contractual framework, we expect it to have sufficient liquidity to meet mandatory payments over the outlook period.\u0026lt;/p\u0026gt;\n      \n      \u0026lt;a name=\u0026quot;ID234\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;\u0026lt;/h4\u0026gt;\n        \u0026lt;a name=\u0026quot;ID239\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;div class=\u0026quot;sideBar \u0026quot;\u0026gt;\u0026lt;div class=\u0026quot;colWrapper\u0026quot;\u0026gt;\u0026lt;div class=\u0026quot;header\u0026quot;\u0026gt;\u0026lt;div class=\u0026quot;left\u0026quot;\u0026gt;\u0026lt;h1\u0026gt;Principal liquidity sources\u0026lt;/h1\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;div class=\u0026quot;right\u0026quot;\u0026gt;\u0026lt;h1\u0026gt;Principal liquidity uses\u0026lt;/h1\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;div class=\u0026quot;left\u0026quot;\u0026gt;\u0026lt;div class=\u0026quot;sideBarBody\u0026quot;\u0026gt;\n          \u0026lt;ul\u0026gt;\n            \u0026lt;li\u0026gt;Cash on hand of $10 million-$15 million at close of the transaction;\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Availability of $80 million-$85 million under the company's new $100 million RCF at close of the transaction; and\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Forecasted funds from operations of $80 million-$90 million over the next 12 months.\u0026lt;/li\u0026gt;\n          \u0026lt;/ul\u0026gt;\n        \u0026lt;/div\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;div class=\u0026quot;right\u0026quot;\u0026gt;\u0026lt;div class=\u0026quot;sideBarBody\u0026quot;\u0026gt;\n          \u0026lt;ul\u0026gt;\n            \u0026lt;li\u0026gt;Annual mandatory debt amortization of $5 million over the next 12 months; and\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Annual maintenance capital expenditures of $10 million-$15 million over the next 12 months.\u0026lt;/li\u0026gt;\n          \u0026lt;/ul\u0026gt;\n        \u0026lt;/div\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;/div\u0026gt;\n        \n      \n      \u0026lt;a name=\u0026quot;ID273\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Covenants\u0026lt;/h4\u0026gt;\n        \u0026lt;p\u0026gt;The company is required to maintain a minimum debt service coverage ratio of 1.10x and maximum first-lien leverage ratio of 6.0x commencing with the last day of the second full fiscal quarter after the closing date, as of the last day of each fiscal quarter. We expect the company to have sufficient headroom for its financial covenants over the next 12 months.\u0026lt;/p\u0026gt;\n      \n      \u0026lt;a name=\u0026quot;ID280\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Environmental, Social, And Governance\u0026lt;/h4\u0026gt;\n        \u0026lt;p\u0026gt;Environmental factors are a negative consideration in our credit rating analysis of CMIH. This reflects our view of the company\u0026rsquo;s operating assets and equity interests in JV affiliates, which include CHOPS, ECLIPS, and Western Gulf. Like midstream peers, we believe it might face longer-term volume risks related to reduced demand for hydrocarbons, reduced drilling activity, and the transition to renewable energy sources. However, these risks are partially mitigated by the company\u0026rsquo;s supportive contract structure.\u0026lt;/p\u0026gt;\n      \n      \u0026lt;a name=\u0026quot;ID287\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Issue Ratings--Recovery Analysis \u0026lt;/h4\u0026gt;\n        \u0026lt;a name=\u0026quot;ID290\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Key analytical factors\u0026lt;/h5\u0026gt;\n          \u0026lt;ul\u0026gt;\n            \u0026lt;li\u0026gt;Our simulated default scenario assumes a default occurring in 2030 due to a prolonged period of reduced throughput across the company's segments leading to reduced revenue and cash flow from its operating assets and JV affiliates.\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;We assume the company's RCF is 85% drawn at the time of default. \u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Debt totals include six months of prepetition interest.\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;To value the company, we apply a 7x multiple to our estimated post-default emergence EBITDA. The 7x multiple is in line with multiples we use for midstream peers.\u0026lt;/li\u0026gt;\n          \u0026lt;/ul\u0026gt;\n        \n        \u0026lt;a name=\u0026quot;ID310\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Simulated default assumptions\u0026lt;/h5\u0026gt;\n          \u0026lt;ul\u0026gt;\n            \u0026lt;li\u0026gt;Simulated year of default: 2030\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;EBITDA at emergence: Approximately $56 million\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;EBITDA multiple: 7x\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Gross enterprise value at emergence: Approximately $390 million\u0026lt;/li\u0026gt;\n          \u0026lt;/ul\u0026gt;\n        \n        \u0026lt;a name=\u0026quot;ID330\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Simplified waterfall\u0026lt;/h5\u0026gt;\n          \u0026lt;ul\u0026gt;\n            \u0026lt;li\u0026gt;Net enterprise value (after 5% administrative costs): Approximately $371 million\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Senior secured debt claims: Approximately $590 million\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;--Recovery expectations: 50%-70% (rounded estimate: 60%)\u0026lt;/li\u0026gt;\n          \u0026lt;/ul\u0026gt;\n          \u0026lt;p\u0026gt;Note: All debt amounts include six months of prepetition interest.\u0026lt;/p\u0026gt;\n        \n      \n      \u0026lt;a name=\u0026quot;ID351\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Rating Component Scores\u0026lt;/h4\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n        \u0026lt;h4 class=\u0026quot;tableHeader\u0026quot;\u0026gt;\u0026lt;/h4\u0026gt;\u0026lt;table border=\u0026quot;0\u0026quot; cellspacing=\u0026quot;0\u0026quot; cellpadding=\u0026quot;0\u0026quot; class=\u0026quot;article \u0026quot;\u0026gt;\n          \u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n            \u0026lt;th class=\u0026quot;tableTitle\u0026quot; colspan=\u0026quot;2\u0026quot;\u0026gt;Rating Component Scores\u0026lt;/th\u0026gt;\n            \n          \u0026lt;/tr\u0026gt;\n          \u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n            \u0026lt;td class=\u0026quot;tableSubHead\u0026quot; colspan=\u0026quot;2\u0026quot;\u0026gt;Component\u0026lt;/td\u0026gt;\n            \n          \u0026lt;/tr\u0026gt;\n          \u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n            \u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;Foreign currency issuer credit rating\u0026lt;/td\u0026gt;\n            \u0026lt;td class=\u0026quot;TableText\u0026quot p;amp;P has established policies and procedures to maintain the confidentiality of certain nonpublic information received in connection with each analytical process.\u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;S\u0026amp;amp;P may receive compensation for its ratings and certain analyses, normally from issuers or underwriters of securities or from obligors.  S\u0026amp;amp;P reserves the right to disseminate its opinions and analyses.  S\u0026amp;amp;P's public ratings and analyses are made available on its Web sites,  \u0026lt;a href=\u0026quot;http://www.spglobal.com/ratings\u0026quot; target=\u0026quot;_new\u0026quot;\u0026gt;www.spglobal.com/ratings\u0026lt;/a\u0026gt; (free of charge), and \u0026lt;a href=\u0026quot;http://www.ratingsdirect.com\u0026quot; target=\u0026quot;_new\u0026quot;\u0026gt;www.ratingsdirect.com\u0026lt;/a\u0026gt; (subscription), and may be distributed through other means, including via S\u0026amp;amp;P publications and third-party redistributors.  Additional information about our ratings fees is available at \u0026lt;a href=\u0026quot;http://www.spglobal.com/usratingsfees\u0026quot; target=\u0026quot;_new\u0026quot;\u0026gt;www.spglobal.com/usratingsfees\u0026lt;/a\u0026gt;.\u0026lt;/p\u0026gt;\u0026lt;p\u0026gt;Any Passwords/user IDs issued by S\u0026amp;amp;P to users are single user-dedicated and may ONLY be used by the individual to whom they have been assigned. No sharing of passwords/user IDs and no simultaneous access via the same password/user ID is permitted. To reprint, translate, or use the data or information other than as provided herein, contact S\u0026amp;amp;P Global Ratings, Client Services, 55 Water Street, New York, NY 10041; (1) 212-438-7280 or by e-mail to: \u0026lt;a href=\u0026quot;mailto:research_request@spglobal.com\u0026quot;\u0026gt;research_request@spglobal.com\u0026lt;/a\u0026gt;.\u0026lt;/p\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;/div\u0026gt;\n\t\t\n","imageContent":{"id":3512918,"articleDate":1770244449000,"title":"Research Update: Crescent Midstream Intermediate Holdings LLC Assigned 'B+' Rating; Debt Rated 'B+'; Outlook Stable","html":"\n\n\t\n\n\t\t\n\n\t\t\n\t\t\u0026lt;div id=\u0026quot;researchContent\u0026quot;\u0026gt;\u0026lt;div id=\u0026quot;articleLinkBox\u0026quot;\u0026gt;\u0026lt;a href=\u0026quot;#ContactInfo\u0026quot; class=\u0026quot;contactInfo\u0026quot;\u0026gt;View Analyst Contact Information\u0026lt;/a\u0026gt;\u0026lt;ul id=\u0026quot;navResearchArticle\u0026quot; class=\u0026quot;nav\u0026quot; onmouseover=\u0026quot;javascript:researchTOCOver();\u0026quot; onmouseout=\u0026quot;javascript:researchTOCOff();\u0026quot;\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;javascript:void(0);\u0026quot;\u0026gt;Table of Contents\u0026lt;/a\u0026gt;\u0026lt;ul id=\u0026quot;navResearchArticleUL\u0026quot;\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID90\u0026quot;\u0026gt;Rating Action Overview\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID113\u0026quot;\u0026gt;Rating Action Rationale \u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID156\u0026quot;\u0026gt;Outlook\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID187\u0026quot;\u0026gt;Company Description\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID203\u0026quot;\u0026gt;Our Base-Case Scenario\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID227\u0026quot;\u0026gt;Liquidity\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID234\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID273\u0026quot;\u0026gt;Covenants\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID280\u0026quot;\u0026gt;Environmental, Social, And Governance\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID287\u0026quot;\u0026gt;Issue Ratings--Recovery Analysis \u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID351\u0026quot;\u0026gt;Rating Component Scores\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID534\u0026quot;\u0026gt;Related Criteria\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID654\u0026quot;\u0026gt;Ratings List\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID768\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;/ul\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;/ul\u0026gt;\u0026lt;div class=\u0026quot;clear\u0026quot;\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;/div\u0026gt;\n      \u0026lt;a name=\u0026quot;ID90\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Rating Action Overview\u0026lt;/h4\u0026gt;\n        \u0026lt;ul\u0026gt;\n          \u0026lt;li\u0026gt;\n            Crescent Midstream Intermediate Holdings LLC (CMIH) intends to issue a $500 million senior secured term loan B (TLB) due 2033 and put in place a new $100 million revolving credit facility (RCF) due 2031, which will be pari passu. The company will use proceeds to repay outstanding debt at Crescent Midstream Holdings LLC (Holdings) and Crescent Midstream Operating LLC (Operating). At close, the company will have $16 million of the RCF drawn and there will be no debt outstanding at the Holdings and Operating levels.\u0026lt;/li\u0026gt;\n          \u0026lt;li\u0026gt;We assigned a 'B+' issuer credit rating to CMIH and a 'B+' issue-level rating to the proposed senior secured TLB with a recovery rating of '3'. The '3' recovery rating indicates our expectation of meaningful (50%-70%; rounded estimate: 60%) recovery in the event of a default.\u0026lt;/li\u0026gt;\n          \u0026lt;li\u0026gt;The stable outlook reflects our expectation that the company will generate stable cash flow and its S\u0026amp;amp;P Global Ratings-adjusted leverage will be 3.50x-3.75x in 2026 and about 3.00x in 2027.\u0026lt;/li\u0026gt;\n        \u0026lt;/ul\u0026gt;\n      \n      \u0026lt;a name=\u0026quot;ID113\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Rating Action Rationale \u0026lt;/h4\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;While the company has doubled in size since 2021, we believe its operating scale is relatively limited.\u0026amp;nbsp;\u0026lt;/span\u0026gt;Over the past few years, the company has taken a number of growth initiatives including the 2025 expansion in Cameron Highway Oil Pipeline System (CHOPS), which increased its capacity to 575,000 barrels per day (bpd) from 350,000 bpd. Through its wholly owned subsidiary, Crescent Midstream LLC (Crescent), the company holds a 36% equity interest in CHOPS.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;The majority of CMIH\u0026rsquo;s cash flows will rely on distributions from its joint venture (JV) affiliates. Despite this significant reliance on JV affiliates for cash flow generation, we forecast stable distributions throughout the outlook period and anticipate its consolidated S\u0026amp;amp;P Global Ratings-adjusted EBITDA will increase to $120 million-$125 million in 2026 and $130 million-$135 million in 2027. \u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;CMIH\u0026rsquo;s stable cash flows are backed by constructive contracts with high-quality counterparties.\u0026amp;nbsp;\u0026lt;/span\u0026gt;The majority of the company\u0026rsquo;s assets are life-of-lease contracted with deepwater wells that have production lives of 20-40 years, limiting its contract renewal risk. We estimate about 89 % of the company's cash flows are underpinned by fixed-fee contracts and about 75% are backed by long term life-of-lease dedication and minimum volume contracts, providing good cash flow visibility. Also, more than 75% of its cash flow is from investment-grade rated counterparties.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;CMIH benefits from its strategically located assets in the Gulf of Mexico despite some concentration risk.\u0026amp;nbsp;\u0026lt;/span\u0026gt;Through its three segments--CHOPS, Eastern Crescent Louisiana Integrated Pipeline System (ECLIPS), and Western Gulf Pipeline System (Western Gulf)--the company primarily transports crude oil from deepwater wells in Gulf of Mexico to refineries in Texas and Louisiana. We generally view volumes from deepwater wells favorably, given their low decline rates.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;The company also benefits from lower break-even prices in Gulf of Mexico compared with other basins. We believe the company is well positioned to secure volumes as there are limited alternative transportation routes in that region due to high infrastructure costs and regulatory hurdles. We also note the concentration in the Gulf of Mexico exposes the company to significant volumetric risks during hurricane downtime.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;CMIH\u0026rsquo;s assets are currently underutilized\u0026amp;nbsp;\u0026lt;/span\u0026gt;, with pipelines operating at 30%-50% of total capacity. Despite this relatively low utilization rate, the company\u0026rsquo;s excess capacity positions it to meet increased demand and potential growth in drilling activity within the region with limited incremental investment needed.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;CMIH has a clear path to deleverage over the next two years.\u0026amp;nbsp;\u0026lt;/span\u0026gt;The company's TLB is subject to a 75% excess cash flow (ECF) sweep if its leverage exceeds 4.0x, decreasing to 50% when leverage is 3.5x-4.0x, 25% when leverage is 2.0x-3.5x, and no cash sweep when it falls below 2x. We anticipate the company will generate at least $70 million of free operating cash flow (FOCF) in 2026 and 2027, supporting deleveraging. We forecast CMIH's S\u0026amp;amp;P Global Ratings-adjusted debt to EBITDA will deleverage from 3.50x-3.75x range in 2026 to around 3.00x in 2027.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;In addition, the anticipated FOCF and availability under its new RCF provide the company with financial flexibility for growth initiatives.\u0026lt;/p\u0026gt;\n      \n      \u0026lt;a name=\u0026quot;ID156\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Outlook\u0026lt;/h4\u0026gt;\n        \u0026lt;p\u0026gt;Our stable outlook on the company reflects the predictability and stability of the company's cash flows backed by a supportive contractual framework. We expect the company\u0026rsquo;s S\u0026amp;amp;P Global Ratings-adjusted leverage of 3.50x-3.75x in 2026 and in the 3.00x area in 2027.\u0026lt;/p\u0026gt;\n        \u0026lt;a name=\u0026quot;ID162\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Downside scenario\u0026lt;/h5\u0026gt;\n          \u0026lt;p\u0026gt;We could consider a negative rating action if we forecast the company will sustain S\u0026amp;amp;P Global Ratings-adjusted leverage above 4.5x. This could occur if:\u0026lt;/p\u0026gt;\n          \u0026lt;ul\u0026gt;\n            \u0026lt;li\u0026gt;The company generates lower-than-expected EBITDA generation due to lower volumes; or\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;The company makes lower-than-anticipated debt repayments.\u0026lt;/li\u0026gt;\n          \u0026lt;/ul\u0026gt;\n        \n        \u0026lt;a name=\u0026quot;ID179\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Upside scenario\u0026lt;/h5\u0026gt;\n          \u0026lt;p\u0026gt;Due to the company's limited scale and geographic diversity, we do not expect to take a positive rating action over the next 12 months. However, we could consider a positive rating action if it maintains S\u0026amp;amp;P Global Ratings-adjusted leverage of 3.0x-3.5x while expanding its operating scale and improving asset utilization.\u0026lt;/p\u0026gt;\n        \n      \n      \u0026lt;a name=\u0026quot;ID187\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Company Description\u0026lt;/h4\u0026gt;\n        \u0026lt;p\u0026gt;CMIH, through its affiliates, provides crude oil transportation services in Louisiana and the U.S. offshore regions of the Gulf of Mexico. CMIH is wholly owned by Holdings, which was formed in 2020 and is based in Louisiana. Holdings is 68% owned by The Carlyle Group and 32% by John Grier, founder of the company. CMIH, through its 100% ownership in Operating, wholly owns and controls Crescent. Including its investments in JV affiliates, Crescent has three segments including CHOPS, ECLIPS, and Western Gulf. \u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;CHOPS is 36% owned by Crescent and 64% owned and operated by Genesis Energy L.P. CHOPS consists of a 380-mile crude oil pipeline with 575,000 bpd capacity that interconnects with refineries and terminals in Port Arthur and Texas City. It delivers crude oil from major fields in the deepwater Gulf of America to refining markets along the Texas Gulf Coast. \u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;ECLIPS operates as a vertically integrated pipeline network extending from the eastern Gulf of America offshore to pipeline infrastructure onshore in Louisiana. It wholly owns and operates the Eastern Gulf Pipeline system. Through ECLIPS, Crescent also holds a 70% equity interest in and operates the Bonefish and Anchorage pipeline systems.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;Crescent holds 100% ownership in Western Gulf\u0026rsquo;s operated assets and minority stakes in certain nonoperated assets that connect to shore. Western Gulf consists of four wholly owned and operated pipeline systems totaling 340 miles and two nonoperated pipeline systems including White Cap and Ship Shoal. It connects offshore production in the Western Gulf to key Louisiana demand markets backed by dedications.\u0026lt;/p\u0026gt;\n      \n      \u0026lt;a name=\u0026quot;ID203\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Our Base-Case Scenario\u0026lt;/h4\u0026gt;\n        \u0026lt;a name=\u0026quot;ID206\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Assumptions\u0026lt;/h5\u0026gt;\n          \u0026lt;ul\u0026gt;\n            \u0026lt;li\u0026gt;West Texas Intermediate crude price of $55 per barrel (/bbl) for the remainder of 2026 and $60/bbl in 2027 and thereafter.\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;We treat the company\u0026rsquo;s noncontrolling equity interests in its JV affiliates under our equity method.\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Annual maintenance capital expenditures averaging $10 million-$15 million in 2026 and 2027.\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;After mandatory amortization and ECF sweeps, the company will make additional debt repayments to achieve leverage target.\u0026lt;/li\u0026gt;\n          \u0026lt;/ul\u0026gt;\n        \n      \n      \u0026lt;a name=\u0026quot;ID227\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Liquidity\u0026lt;/h4\u0026gt;\n        \u0026lt;p\u0026gt;Pro forma for the transaction, we assess the company\u0026rsquo;s liquidity as adequate, with sources exceeding uses by above 2.0x over the next 12 months. Although we typically view a ratio above 2.0x as commensurate with stronger assessment, we limit our assessment at adequate based on certain qualitative factors, including its limited track record of absorbing a high-impact, low-probability event without refinancing and lack of a high standing in the credit markets. Given the company's supportive contractual framework, we expect it to have sufficient liquidity to meet mandatory payments over the outlook period.\u0026lt;/p\u0026gt;\n      \n      \u0026lt;a name=\u0026quot;ID234\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;\u0026lt;/h4\u0026gt;\n        \u0026lt;a name=\u0026quot;ID239\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;div class=\u0026quot;sideBar \u0026quot;\u0026gt;\u0026lt;div class=\u0026quot;colWrapper\u0026quot;\u0026gt;\u0026lt;div class=\u0026quot;header\u0026quot;\u0026gt;\u0026lt;div class=\u0026quot;left\u0026quot;\u0026gt;\u0026lt;h1\u0026gt;Principal liquidity sources\u0026lt;/h1\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;div class=\u0026quot;right\u0026quot;\u0026gt;\u0026lt;h1\u0026gt;Principal liquidity uses\u0026lt;/h1\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;div class=\u0026quot;left\u0026quot;\u0026gt;\u0026lt;div class=\u0026quot;sideBarBody\u0026quot;\u0026gt;\n          \u0026lt;ul\u0026gt;\n            \u0026lt;li\u0026gt;Cash on hand of $10 million-$15 million at close of the transaction;\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Availability of $80 million-$85 million under the company's new $100 million RCF at close of the transaction; and\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Forecasted funds from operations of $80 million-$90 million over the next 12 months.\u0026lt;/li\u0026gt;\n          \u0026lt;/ul\u0026gt;\n        \u0026lt;/div\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;div class=\u0026quot;right\u0026quot;\u0026gt;\u0026lt;div class=\u0026quot;sideBarBody\u0026quot;\u0026gt;\n          \u0026lt;ul\u0026gt;\n            \u0026lt;li\u0026gt;Annual mandatory debt amortization of $5 million over the next 12 months; and\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Annual maintenance capital expenditures of $10 million-$15 million over the next 12 months.\u0026lt;/li\u0026gt;\n          \u0026lt;/ul\u0026gt;\n        \u0026lt;/div\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;/div\u0026gt;\n        \n      \n      \u0026lt;a name=\u0026quot;ID273\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Covenants\u0026lt;/h4\u0026gt;\n        \u0026lt;p\u0026gt;The company is required to maintain a minimum debt service coverage ratio of 1.10x and maximum first-lien leverage ratio of 6.0x commencing with the last day of the second full fiscal quarter after the closing date, as of the last day of each fiscal quarter. We expect the company to have sufficient headroom for its financial covenants over the next 12 months.\u0026lt;/p\u0026gt;\n      \n      \u0026lt;a name=\u0026quot;ID280\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Environmental, Social, And Governance\u0026lt;/h4\u0026gt;\n        \u0026lt;p\u0026gt;Environmental factors are a negative consideration in our credit rating analysis of CMIH. This reflects our view of the company\u0026rsquo;s operating assets and equity interests in JV affiliates, which include CHOPS, ECLIPS, and Western Gulf. Like midstream peers, we believe it might face longer-term volume risks related to reduced demand for hydrocarbons, reduced drilling activity, and the transition to renewable energy sources. However, these risks are partially mitigated by the company\u0026rsquo;s supportive contract structure.\u0026lt;/p\u0026gt;\n      \n      \u0026lt;a name=\u0026quot;ID287\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Issue Ratings--Recovery Analysis \u0026lt;/h4\u0026gt;\n        \u0026lt;a name=\u0026quot;ID290\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Key analytical factors\u0026lt;/h5\u0026gt;\n          \u0026lt;ul\u0026gt;\n            \u0026lt;li\u0026gt;Our simulated default scenario assumes a default occurring in 2030 due to a prolonged period of reduced throughput across the company's segments leading to reduced revenue and cash flow from its operating assets and JV affiliates.\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;We assume the company's RCF is 85% drawn at the time of default. \u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Debt totals include six months of prepetition interest.\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;To value the company, we apply a 7x multiple to our estimated post-default emergence EBITDA. The 7x multiple is in line with multiples we use for midstream peers.\u0026lt;/li\u0026gt;\n          \u0026lt;/ul\u0026gt;\n        \n        \u0026lt;a name=\u0026quot;ID310\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Simulated default assumptions\u0026lt;/h5\u0026gt;\n          \u0026lt;ul\u0026gt;\n            \u0026lt;li\u0026gt;Simulated year of default: 2030\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;EBITDA at emergence: Approximately $56 million\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;EBITDA multiple: 7x\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Gross enterprise value at emergence: Approximately $390 million\u0026lt;/li\u0026gt;\n          \u0026lt;/ul\u0026gt;\n        \n        \u0026lt;a name=\u0026quot;ID330\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Simplified waterfall\u0026lt;/h5\u0026gt;\n          \u0026lt;ul\u0026gt;\n            \u0026lt;li\u0026gt;Net enterprise value (after 5% administrative costs): Approximately $371 million\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Senior secured debt claims: Approximately $590 million\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;--Recovery expectations: 50%-70% (rounded estimate: 60%)\u0026lt;/li\u0026gt;\n          \u0026lt;/ul\u0026gt;\n          \u0026lt;p\u0026gt;Note: All debt amounts include six months of prepetition interest.\u0026lt;/p\u0026gt;\n        \n      \n      \u0026lt;a name=\u0026quot;ID351\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Rating Component Scores\u0026lt;/h4\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n        \u0026lt;h4 class=\u0026quot;tableHeader\u0026quot;\u0026gt;\u0026lt;/h4\u0026gt;\u0026lt;table border=\u0026quot;0\u0026quot; cellspacing=\u0026quot;0\u0026quot; cellpadding=\u0026quot;0\u0026quot; class=\u0026quot;article \u0026quot;\u0026gt;\n          \u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n            \u0026lt;th class=\u0026quot;tableTitle\u0026quot; colspan=\u0026quot;2\u0026quot;\u0026gt;Rating Component Scores\u0026lt;/th\u0026gt;\n            \n          \u0026lt;/tr\u0026gt;\n          \u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n            \u0026lt;td class=\u0026quot;tableSubHead\u0026quot; colspan=\u0026quot;2\u0026quot;\u0026gt;Component\u0026lt;/td\u0026gt;\n            \n          \u0026lt;/tr\u0026gt;\n          \u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n            \u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;Foreign currency issuer credit rating\u0026lt;/td\u0026gt;\n            \u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;B+/Stable/--\u0026lt;/td\u0026gt;\n          \u0026lt;/tr\u0026gt;\n          \u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n            \u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;Local currency issuer credit rating\u0026lt;/td\u0026gt;\n            \u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;B+/Stable/--\u0026lt;/td\u0026gt;\n          \u0026lt;/tr\u0026gt;\n          \u0026lt;tr class=\u0026quot;rowStripe\u0026quot;\u0026gt;\n            \u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;Business risk\u0026lt;/td\u0026gt;\n            \u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;Weak\u0026lt;/td\u0026gt;\n
