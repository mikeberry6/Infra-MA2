name: Live TXNM staging verification

on:
  push:
    branches: [codex/evidence-backed-news-staging]
    paths:
      - ".github/workflows/news-txnm-staging.yml"
      - ".github/staging/**"
      - "scripts/*news*staging*"
      - "src/modules/news-evidence/**"

permissions:
  contents: read

concurrency:
  group: news-evidence-txnm-staging
  cancel-in-progress: false

jobs:
  pilot:
    if: github.ref == 'refs/heads/codex/evidence-backed-news-staging'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    services:
      isolated-postgres:
        image: postgres:17
        env:
          POSTGRES_DB: news_evidence_staging
          POSTGRES_USER: txnm_stage
          POSTGRES_PASSWORD: runner-only-pilot
        options: >-
          --health-cmd "pg_isready -U txnm_stage -d news_evidence_staging"
          --health-interval 5s --health-timeout 3s --health-retries 10
        ports:
          - 5432/tcp
    env:
      NEWS_PIPELINE_TARGET: staging
      NEWS_EVIDENCE_ENABLED: "true"
      NEWS_DEAL_MUTATIONS_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      NEWS_PROCESSING_VERSION: txnm-staging-live-3
      NEWS_MODEL_TIMEOUT_MS: "100000"
      NEWS_MODEL_MAX_ATTEMPTS: "2"
      NEWS_TXNM_STAGING_ORIGIN: http://127.0.0.1:3100
      NEXTAUTH_URL: http://127.0.0.1:3100/Infra-MA2/api/auth
      BASELINE_SHA: a37f0f16d6a61fbe119aa2b822eaca603250bdab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/audits/*
            /audits/briefing-deals/archive.json
            /audits/weekly-briefing-activity/
            /audits/deal-portco-flowthrough-2026-05-05.md
            !/outputs/
            !/deliverables/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Provision the isolated Neon staging database
        id: provision
        continue-on-error: true
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEWS_STAGING_RESUME_RUN_ID: "43805918495"
          PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
          PRODUCTION_MIGRATION_DATABASE_HOST: ${{ vars.PRODUCTION_MIGRATION_DATABASE_HOST }}
          DASHBOARD_MIGRATION_DATABASE_HOST: ${{ vars.DASHBOARD_MIGRATION_DATABASE_HOST }}
          MIGRATION_DATABASE_HOST: ${{ vars.MIGRATION_DATABASE_HOST }}
        run: node scripts/provision-news-staging.mjs
      - name: Use runner-isolated staging for verification if the hosted target is unavailable
        if: steps.provision.outcome == 'failure'
        env:
          STAGING_POSTGRES_PORT: ${{ job.services.isolated-postgres.ports[5432] }}
          PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
          PRODUCTION_MIGRATION_DATABASE_HOST: ${{ vars.PRODUCTION_MIGRATION_DATABASE_HOST }}
        run: |
          [[ "$STAGING_POSTGRES_PORT" =~ ^[0-9]+$ ]]
          printf '%s\n'             "DATABASE_URL=postgresql://txnm_stage:runner-only-pilot@127.0.0.1:$STAGING_POSTGRES_PORT/news_evidence_staging"             "EXPECTED_DATABASE_HOST=127.0.0.1" "EXPECTED_DATABASE_NAME=news_evidence_staging"             "FORBIDDEN_DATABASE_HOST=$PRODUCTION_DATABASE_HOST"             "FORBIDDEN_DATABASE_HOST_2=$PRODUCTION_MIGRATION_DATABASE_HOST" >> "$GITHUB_ENV"
      - name: Apply baseline and evidence migration to the fresh staging database
        run: |
          node --experimental-strip-types scripts/assert-database-target.ts
          work="${RUNNER_TEMP}/infra-news-schema"
          mkdir -p "$work"
          if ! git cat-file -e "$BASELINE_SHA^{commit}"; then
            git fetch --filter=blob:none --no-tags --depth=1 origin "$BASELINE_SHA"
          fi
          git show "$BASELINE_SHA:prisma/schema.prisma" > "$work/baseline.prisma"
          schema_state="$(node --input-type=module <<'JS'
          import pg from "pg";
          const db = new pg.Client({connectionString: process.env.DATABASE_URL});
          await db.connect();
          try {
            const { rows: [state] } = await db.query(`SELECT
              to_regclass('public."NewsItem"') IS NOT NULL AS baseline,
              to_regclass('public."NewsSourceVersion"') IS NOT NULL AS evidence`);
            process.stdout.write(state.evidence ? "ready" : state.baseline ? "baseline" : "empty");
          } finally { await db.end(); }
          JS
          )"
          if [[ "$schema_state" == empty ]]; then
            npx prisma migrate diff --from-empty --to-schema "$work/baseline.prisma" --script > "$work/baseline.sql"
            npx prisma db execute --file "$work/baseline.sql"
          fi
          if [[ "$schema_state" != ready ]]; then
            npx prisma migrate diff --from-schema "$work/baseline.prisma" --to-config-datasource --exit-code
            npx prisma db execute --file prisma/migrations/20261115220000_news_evidence/migration.sql
          fi
          npx prisma migrate diff --from-schema prisma/schema.prisma --to-config-datasource --exit-code
      - name: Seed isolated admin and stage the verified filing
        run: |
          admin_email="txnm-staging-${GITHUB_RUN_ID}@example.test"
          admin_password="Txnm9!$(openssl rand -hex 20)"
          auth_secret="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$admin_password" "$auth_secret"
          ADMIN_EMAIL="$admin_email" ADMIN_PASSWORD="$admin_password" npm run admin:create
          printf 'NEWS_TXNM_STAGING_ADMIN_EMAIL=%s\nNEWS_TXNM_STAGING_ADMIN_PASSWORD=%s\nNEXTAUTH_SECRET=%s\n' \
            "$admin_email" "$admin_password" "$auth_secret" >> "$GITHUB_ENV"
          npx tsx scripts/check-news-txnm-staging.ts prepare
      - name: Process the TXNM filing with live Luna and Sol
        id: process
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/run-with-retry.mjs --attempts=2 --base-delay-ms=35000 -- npm run news:evidence -- process --limit=15
      - name: Report sanitized processing receipts
        if: ${{ !cancelled() && steps.process.outcome != 'skipped' }}
        run: npx tsx scripts/check-news-txnm-staging.ts diagnose
      - name: Verify live receipts and the evidence-backed draft
        run: npx tsx scripts/check-news-txnm-staging.ts before
      - name: Build the isolated staging application
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify the feed before and after staging-only editorial approval
        env:
          NEWS_TXNM_STAGING_SMOKE: "true"
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > "${RUNNER_TEMP}/news-stage-app.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --silent --fail --output /dev/null "$NEWS_TXNM_STAGING_ORIGIN/Infra-MA2/news?period=All"; then break; fi
            if ! kill -0 "$app_pid" || [[ $attempt == 40 ]]; then
              echo "::error::The isolated staging application did not start."
              exit 1
            fi
            sleep 1
          done
          npx tsx scripts/verify-news-txnm-staging.ts
          npx tsx scripts/check-news-txnm-staging.ts after
      - name: Deploy a staging-only Vercel Preview
        if: steps.provision.outcome == 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: team_5n5cDMTg05n53JAZ7Wz5Z336
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          export NEWS_DIGEST_START_DATE="$(TZ=America/New_York date +%F)"
          printf 'NEWS_DIGEST_START_DATE=%s\n' "$NEWS_DIGEST_START_DATE" >> "$GITHUB_ENV"
          bash scripts/deploy-news-staging.sh
      - name: Verify the hosted feed and activate the staging digest
        if: steps.provision.outcome == 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: team_5n5cDMTg05n53JAZ7Wz5Z336
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
        run: bash scripts/enable-news-staging-digest.sh
      - name: Report a hosted-target blocker after runner-isolated verification
        if: steps.provision.outcome == 'failure'
        run: |
          echo "::error::The live filing and approval were verified on runner-isolated staging. Hosted staging is unavailable and the digest remains inactive."
          exit 1
