name: Dashboard Data Pipeline

on:
  schedule:
    # GitHub cron is UTC. These paired slots resolve to exactly 07:30 Eastern
    # in daylight and standard time; admission classifies the inactive slot
    # without presenting it as a successful synchronization.
    - cron: "30 11 * * 1-5"
    - cron: "30 12 * * 1-5"
    - cron: "0 12 * * 0"
    # Monthly all-source audit at 08:00 Eastern, DST-safe.
    - cron: "0 12 1 * *"
    - cron: "0 13 1 * *"
  workflow_dispatch:
    inputs:
      pipeline:
        description: Dashboard operation to run
        required: true
        default: verify
        type: choice
        options:
          - dashboard
          - verify
          - source-audit
      write_confirmation:
        description: Type SYNC-PRODUCTION for a manual dashboard write; leave blank for read-only operations
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dashboard-pipeline-${{ inputs.pipeline || ((github.event.schedule == '30 11 * * 1-5' || github.event.schedule == '30 12 * * 1-5') && 'dashboard') || (github.event.schedule == '0 12 * * 0' && 'verify') || 'source-audit' }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  admission:
    name: Classify dashboard pipeline invocation
    runs-on: ubuntu-latest
    outputs:
      admitted: ${{ steps.classify.outputs.admitted }}
      operation: ${{ steps.classify.outputs.operation }}
      reason: ${{ steps.classify.outputs.reason }}
      refresh_window: ${{ steps.classify.outputs.refresh_window }}
    steps:
      - name: Classify schedule or manual operation
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_PIPELINE: ${{ inputs.pipeline }}
        shell: bash
        run: |
          admitted=false
          operation=none
          reason=unsupported-invocation
          eastern_offset="$(TZ=America/New_York date +%z)"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            admitted=true
            operation="$REQUESTED_PIPELINE"
            reason=manual-dispatch
          else
            case "$EVENT_SCHEDULE" in
              "30 11 * * 1-5")
                operation=dashboard
                if [ "$eastern_offset" = "-0400" ]; then
                  admitted=true
                  reason=daylight-schedule-admitted
                else
                  reason=daylight-schedule-not-current
                fi
                ;;
              "30 12 * * 1-5")
                operation=dashboard
                if [ "$eastern_offset" = "-0500" ]; then
                  admitted=true
                  reason=standard-schedule-admitted
                else
                  reason=standard-schedule-not-current
                fi
                ;;
              "0 12 * * 0")
                admitted=true
                operation=verify
                reason=weekly-verification
                ;;
              "0 12 1 * *")
                operation=source-audit
                if [ "$eastern_offset" = "-0400" ]; then
                  admitted=true
                  reason=daylight-source-audit-admitted
                else
                  reason=daylight-source-audit-not-current
                fi
                ;;
              "0 13 1 * *")
                operation=source-audit
                if [ "$eastern_offset" = "-0500" ]; then
                  admitted=true
                  reason=standard-source-audit-admitted
                else
                  reason=standard-source-audit-not-current
                fi
                ;;
            esac
          fi

          case "$operation" in
            dashboard|verify|source-audit|none) ;;
            *)
              echo "::error::Unsupported dashboard pipeline operation: $operation"
              exit 1
              ;;
          esac

          {
            echo "admitted=$admitted"
            echo "operation=$operation"
            echo "reason=$reason"
            echo "refresh_window=$(TZ=America/New_York date +%F)"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Dashboard pipeline admission"
            echo
            echo "- Operation: \`$operation\`"
            echo "- Admitted workload: \`$admitted\`"
            echo "- Reason: \`$reason\`"
            echo "- Eastern offset: \`$eastern_offset\`"
          } >> "$GITHUB_STEP_SUMMARY"

  dashboard:
    name: Weekday dashboard synchronization
    needs: admission
    if: needs.admission.outputs.operation == 'dashboard' && needs.admission.outputs.admitted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EXPECTED_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
      EXPECTED_DATABASE_NAME: ${{ vars.PRODUCTION_DATABASE_NAME }}
      FORBIDDEN_DATABASE_HOST: ${{ vars.MIGRATION_DATABASE_HOST }}
      FORBIDDEN_DATABASE_HOST_2: ${{ vars.DASHBOARD_MIGRATION_DATABASE_HOST }}
      DASHBOARD_RELIABILITY_START_DATE: ${{ vars.DASHBOARD_RELIABILITY_START_DATE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Record admitted synchronization context
        env:
          ADMISSION_REASON: ${{ needs.admission.outputs.reason }}
          REFRESH_WINDOW: ${{ needs.admission.outputs.refresh_window }}
          RELEASE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p tmp
          node - <<'NODE' > tmp/dashboard-run-context.json
          const context = {
            operation: "dashboard",
            admitted: true,
            admissionReason: process.env.ADMISSION_REASON,
            refreshWindow: process.env.REFRESH_WINDOW,
            releaseSha: process.env.RELEASE_SHA,
            runId: process.env.RUN_ID,
            runAttempt: process.env.RUN_ATTEMPT,
          };
          process.stdout.write(`${JSON.stringify(context, null, 2)}\n`);
          NODE

      - name: Verify production database target
        run: node --experimental-strip-types scripts/assert-database-target.ts

      - name: Require explicit production writes and every provider credential
        env:
          DASHBOARD_WRITES_ENABLED: ${{ vars.DASHBOARD_WRITES_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          WRITE_CONFIRMATION: ${{ inputs.write_confirmation }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        shell: bash
        run: |
          if [ "$DASHBOARD_WRITES_ENABLED" != "true" ]; then
            echo "::error::DASHBOARD_WRITES_ENABLED must be exactly true after a reviewed all-source dry-run."
            exit 1
          fi
          if [[ ! "$DASHBOARD_RELIABILITY_START_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::DASHBOARD_RELIABILITY_START_DATE must use YYYY-MM-DD."
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$WRITE_CONFIRMATION" != "SYNC-PRODUCTION" ]; then
            echo "::error::Manual dashboard writes require write_confirmation=SYNC-PRODUCTION."
            exit 1
          fi
          missing=0
          for name in FRED_API_KEY EIA_API_KEY SAM_API_KEY SEC_USER_AGENT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required for dashboard synchronization."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Install locked dependencies
        run: npm ci

      - name: Synchronize official sources with bounded retries
        id: sync
        env:
          DASHBOARD_REFRESH_WINDOW: ${{ needs.admission.outputs.refresh_window }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SEC_WATCHLIST_CIKS: ${{ vars.SEC_WATCHLIST_CIKS }}
        run: node scripts/run-with-retry.mjs --attempts=3 -- npm run dashboard:sync

      - name: Enforce freshness, rolling success, and missed-window thresholds
        id: reliability
        if: always() && steps.sync.outcome != 'skipped'
        run: >-
          npx tsx scripts/verify-dashboard-health.ts
          --window-days=30
          --max-age-hours=36
          --min-success-rate=0.95
          --start-date="$DASHBOARD_RELIABILITY_START_DATE"
          --output=tmp/dashboard-reliability.json

      - name: Upload synchronization evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-sync-${{ github.run_id }}
          path: |
            tmp/dashboard-run-context.json
            tmp/dashboard-sync-summary.json
            tmp/dashboard-reliability.json
          if-no-files-found: error
          retention-days: 30

      - name: Summarize synchronization outcome
        if: always()
        env:
          REFRESH_WINDOW: ${{ needs.admission.outputs.refresh_window }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          RELIABILITY_OUTCOME: ${{ steps.reliability.outcome }}
        run: |
          {
            echo "### Dashboard synchronization"
            echo
            echo "- Refresh window: \`$REFRESH_WINDOW\`"
            echo "- Synchronization: \`$SYNC_OUTCOME\`"
            echo "- Reliability gate: \`$RELIABILITY_OUTCOME\`"
            echo "- Evidence artifact: \`dashboard-sync-${{ github.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Weekly dashboard freshness verification
    needs: admission
    if: needs.admission.outputs.operation == 'verify' && needs.admission.outputs.admitted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EXPECTED_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
      EXPECTED_DATABASE_NAME: ${{ vars.PRODUCTION_DATABASE_NAME }}
      FORBIDDEN_DATABASE_HOST: ${{ vars.MIGRATION_DATABASE_HOST }}
      FORBIDDEN_DATABASE_HOST_2: ${{ vars.DASHBOARD_MIGRATION_DATABASE_HOST }}
      DASHBOARD_RELIABILITY_START_DATE: ${{ vars.DASHBOARD_RELIABILITY_START_DATE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Verify production database target
        run: node --experimental-strip-types scripts/assert-database-target.ts
      - name: Install locked dependencies
        run: npm ci
      - name: Verify every public metric and approved signal
        id: publication
        run: npm run dashboard:verify -- --require-complete
      - name: Verify recurring-run reliability
        id: reliability
        run: >-
          npx tsx scripts/verify-dashboard-health.ts
          --window-days=30
          --max-age-hours=80
          --min-success-rate=0.95
          --start-date="$DASHBOARD_RELIABILITY_START_DATE"
          --output=tmp/weekly-dashboard-reliability.json
      - name: Upload weekly verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-weekly-verification-${{ github.run_id }}
          path: |
            tmp/dashboard-verify-summary.json
            tmp/weekly-dashboard-reliability.json
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize weekly verification outcome
        if: always()
        env:
          PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
          RELIABILITY_OUTCOME: ${{ steps.reliability.outcome }}
        run: |
          {
            echo "### Weekly dashboard verification"
            echo
            echo "- Publication completeness: \`$PUBLICATION_OUTCOME\`"
            echo "- Rolling reliability: \`$RELIABILITY_OUTCOME\`"
            echo "- Evidence artifact: \`dashboard-weekly-verification-${{ github.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  source-audit:
    name: Monthly all-source live dry-run
    needs: admission
    if: needs.admission.outputs.operation == 'source-audit' && needs.admission.outputs.admitted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EXPECTED_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
      EXPECTED_DATABASE_NAME: ${{ vars.PRODUCTION_DATABASE_NAME }}
      FORBIDDEN_DATABASE_HOST: ${{ vars.MIGRATION_DATABASE_HOST }}
      FORBIDDEN_DATABASE_HOST_2: ${{ vars.DASHBOARD_MIGRATION_DATABASE_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Verify read-only database target
        run: node --experimental-strip-types scripts/assert-database-target.ts
      - name: Install locked dependencies
        run: npm ci
      - name: Require every provider credential
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        shell: bash
        run: |
          missing=0
          for name in FRED_API_KEY EIA_API_KEY SAM_API_KEY SEC_USER_AGENT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required for the all-source audit."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
      - name: Exercise every source without writes
        id: dry_run
        env:
          DASHBOARD_REFRESH_WINDOW: ${{ needs.admission.outputs.refresh_window }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SEC_WATCHLIST_CIKS: ${{ vars.SEC_WATCHLIST_CIKS }}
        run: node scripts/run-with-retry.mjs --attempts=3 -- npm run dashboard:sync:dry-run
      - name: Verify checked-in source metadata
        id: source_metadata
        run: npx vitest run src/modules/dashboard/source-registry.test.ts
      # Do not run --require-complete here: this audit intentionally precedes
      # first-write enablement during rollout.
      - name: Upload source-audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-source-audit-${{ github.run_id }}
          path: tmp/dashboard-sync-summary.json
          if-no-files-found: error
          retention-days: 90
      - name: Summarize source-audit outcome
        if: always()
        env:
          REFRESH_WINDOW: ${{ needs.admission.outputs.refresh_window }}
          DRY_RUN_OUTCOME: ${{ steps.dry_run.outcome }}
          SOURCE_METADATA_OUTCOME: ${{ steps.source_metadata.outcome }}
        run: |
          {
            echo "### Dashboard source audit"
            echo
            echo "- Read-only mode: \`true\`"
            echo "- Refresh window: \`$REFRESH_WINDOW\`"
            echo "- Provider dry-run: \`$DRY_RUN_OUTCOME\`"
            echo "- Source metadata: \`$SOURCE_METADATA_OUTCOME\`"
            echo "- Evidence artifact: \`dashboard-source-audit-${{ github.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
