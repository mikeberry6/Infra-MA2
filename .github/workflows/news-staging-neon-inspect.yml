name: Inspect TXNM staging targets

on:
  push:
    branches: [codex/txnm-staging-probe]
    paths: [".github/workflows/news-staging-neon-inspect.yml"]

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/codex/txnm-staging-probe'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Read eligible Neon branch metadata only
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          DASHBOARD_MIGRATION_DATABASE_HOST: ${{ vars.DASHBOARD_MIGRATION_DATABASE_HOST }}
          MIGRATION_DATABASE_HOST: ${{ vars.MIGRATION_DATABASE_HOST }}
          PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
          PRODUCTION_MIGRATION_DATABASE_HOST: ${{ vars.PRODUCTION_MIGRATION_DATABASE_HOST }}
        run: |
          node --input-type=module <<'NODE'
          const allowed = new Set(["DASHBOARD_MIGRATION_DATABASE_HOST", "MIGRATION_DATABASE_HOST", "PRODUCTION_DATABASE_HOST", "PRODUCTION_MIGRATION_DATABASE_HOST"]);
          const normalize = (value) => value?.toLowerCase().replace(/-pooler(?=\.)/, "");
          const labels = new Map(Array.from(allowed).map((variable) => [normalize(process.env[variable]), variable]));
          const read = async (path) => {
            const response = await fetch(`https://console.neon.tech/api/v2/projects/${process.env.NEON_PROJECT_ID}${path}`, {
              headers: { "Authorization": `Bearer ${process.env.NEON_API_KEY}` },
              signal: AbortSignal.timeout(20_000),
              redirect: "error",
            });
            if (!response.ok) throw new Error(`Neon read ${path} returned HTTP ${response.status}`);
            return response.json();
          };
          const info = await read("/branches/br-rough-term-amnv0r82");
          const branch = info.branch;
          const endpointData = await read(`/branches/${branch.id}/endpoints`);
          const role = "news_evidence_staging";
          const endpoint = endpointData.endpoints.find((item) => item.type === "read_write");
          const params = new URLSearchParams({ branch_id: branch.id, endpoint_id: endpoint.id,
            database_name: role, role_name: role, pooled: "false" });
          const credentials = await read(`/connection_uri?${params}`);
          const target = new URL(credentials.uri);
          console.log(JSON.stringify({ uriCompatibility: {
            protocol: target.protocol,
            endpointMatch: target.hostname === endpoint.host,
            normalizedEndpointMatch: normalize(target.hostname) === normalize(endpoint.host),
            databaseMatch: target.pathname === `/${role}`,
            usernameMatch: target.username === role,
            hasPassword: Boolean(target.password),
            placeholderPassword: /^\[|^\*+$/.test(target.password),
          } }));
          const annotations = info.annotation?.value;
          console.log(JSON.stringify({
            id: branch.id, name: branch.name, primary: branch.primary ?? null, default: branch.default ?? null,
            parentId: branch.parent_id ?? null, initSource: branch.init_source ?? null,
            annotationValueType: typeof annotations,
            annotationKeys: Object.keys(annotations ?? {}),
            matchesPurpose: annotations?.stagingPurpose === "evidence-news",
            matchesRun: annotations?.stagingRun === "43805918495",
            matchesSchemaSource: annotations?.schemaSource === "br-autumn-feather-amwo1hya",
            endpointLabels: endpointData.endpoints.map((endpoint) => ({
              branchId: endpoint.branch_id, type: endpoint.type, hostLabel: labels.get(normalize(endpoint.host)) ?? "other",
            })),
          }));
          NODE
