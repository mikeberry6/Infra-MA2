name: Apply Reviewed Portfolio Fund Attribution

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character commit serving canonical production and at protected main
        required: true
        type: string
      pull_request_number:
        description: Merged pull request that produced release_sha
        required: true
        type: string
      manifest_path:
        description: Repository-relative reviewed portfolio fund attribution apply manifest
        required: true
        type: string
      approval_path:
        description: Repository-relative approval bound to the apply manifest
        required: true
        type: string
      manifest_sha256:
        description: Exact lowercase apply-manifest SHA-256
        required: true
        type: string
      approval_sha256:
        description: Exact lowercase approval SHA-256
        required: true
        type: string
      confirmation:
        description: Type APPLY to authorize this reviewed attribution write
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  deployments: read
  pull-requests: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  apply-reviewed-attribution:
    name: Apply reviewed portfolio fund attribution
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      RELEASE_SHA: ${{ inputs.release_sha }}
      PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
      MANIFEST_PATH: ${{ inputs.manifest_path }}
      APPROVAL_PATH: ${{ inputs.approval_path }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      APPROVAL_SHA256: ${{ inputs.approval_sha256 }}
      CONFIRMATION: ${{ inputs.confirmation }}
      SEED_MANIFEST_PATH: prisma/seed-data/ownership-attributions.manifest.json
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EXPECTED_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
      EXPECTED_DATABASE_NAME: ${{ vars.PRODUCTION_DATABASE_NAME }}
      FORBIDDEN_DATABASE_HOST: ${{ vars.PRODUCTION_MIGRATION_DATABASE_HOST }}
      FORBIDDEN_DATABASE_HOST_2: ${{ vars.MIGRATION_DATABASE_HOST }}
      FORBIDDEN_DATABASE_HOST_3: ${{ vars.DASHBOARD_MIGRATION_DATABASE_HOST }}
      TARGET_DATABASE: production
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      EXPECTED_VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      EXPECTED_GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      CANONICAL_PRODUCTION_URL: https://infra-ma-2.vercel.app
      PUBLIC_BASE_PATH: /Infra-MA2
      REVALIDATE_URL: ${{ secrets.FUND_REFRESH_REVALIDATE_URL }}
      REVALIDATE_TOKEN: ${{ secrets.FUND_REFRESH_REVALIDATE_TOKEN }}

    steps:
      - name: Require protected-main dispatch and exact input shapes
        env:
          DISPATCH_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          if [ "$DISPATCH_REF" != "refs/heads/$DEFAULT_BRANCH" ] || [ "$DEFAULT_BRANCH" != "main" ]; then
            echo "::error::Dispatch this workflow from protected main."
            exit 1
          fi
          [ "$CONFIRMATION" = "APPLY" ] || { echo "::error::confirmation must exactly equal APPLY."; exit 1; }
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release_sha must be a lowercase 40-character SHA."; exit 1; }
          [[ "$PULL_REQUEST_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "::error::pull_request_number must be positive."; exit 1; }
          for name in MANIFEST_SHA256 APPROVAL_SHA256; do
            [[ "${!name}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::$name must be a lowercase SHA-256."; exit 1; }
          done
          [[ "$MANIFEST_PATH" =~ ^audits/portfolio-fund-attribution/[0-9]{4}-[0-9]{2}-[0-9]{2}/apply-manifest\.json$ ]] || {
            echo "::error::manifest_path is outside the approved attribution layout."
            exit 1
          }
          expected_approval="${MANIFEST_PATH%/apply-manifest.json}/approval.json"
          [ "$APPROVAL_PATH" = "$expected_approval" ] || { echo "::error::approval_path must accompany the selected manifest."; exit 1; }
          echo "PRODUCTION_SNAPSHOT_PATH=${MANIFEST_PATH%/apply-manifest.json}/production-snapshot.json" >> "$GITHUB_ENV"

      - name: Checkout current protected main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact protected-main release
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git checkout -B main refs/remotes/origin/main
          git branch --set-upstream-to=origin/main main
          [ "$(git rev-parse HEAD)" = "$RELEASE_SHA" ] || { echo "::error::main advanced beyond release_sha."; exit 1; }
          [ "$(git rev-parse '@{upstream}')" = "$RELEASE_SHA" ] || { echo "::error::origin/main differs from release_sha."; exit 1; }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind merged pull request to the release SHA
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            if (!pr.merged || pr.merge_commit_sha !== process.env.EXPECTED_RELEASE_SHA || pr.base.ref !== context.payload.repository.default_branch) {
              core.setFailed("The selected PR did not produce this protected-main release.");
            }

      - name: Require protected production configuration
        shell: bash
        run: |
          missing=0
          for name in DATABASE_URL EXPECTED_DATABASE_HOST EXPECTED_DATABASE_NAME FORBIDDEN_DATABASE_HOST FORBIDDEN_DATABASE_HOST_2 FORBIDDEN_DATABASE_HOST_3 VERCEL_TOKEN VERCEL_SCOPE EXPECTED_VERCEL_PROJECT_ID EXPECTED_GITHUB_REPOSITORY_ID PRODUCTION_URL REVALIDATE_URL REVALIDATE_TOKEN; do
            if [ -z "${!name:-}" ]; then echo "::error::$name is required."; missing=1; fi
          done
          [ "$PRODUCTION_URL" = "$CANONICAL_PRODUCTION_URL" ] || { echo "::error::PRODUCTION_URL is not canonical."; missing=1; }
          expected_revalidate_url="${CANONICAL_PRODUCTION_URL}${PUBLIC_BASE_PATH}/api/internal/fund-refresh/revalidate"
          [ "$REVALIDATE_URL" = "$expected_revalidate_url" ] || { echo "::error::REVALIDATE_URL is not canonical."; missing=1; }
          [[ "$REVALIDATE_TOKEN" =~ ^[A-Fa-f0-9]{64}$ ]] || { echo "::error::REVALIDATE_TOKEN must be 64 hexadecimal characters."; missing=1; }
          [[ "$EXPECTED_DATABASE_HOST" == *-pooler.* ]] || { echo "::error::Production attribution apply must use the pooler."; missing=1; }
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Install locked dependencies
        run: npm ci

      - name: Bind required build and canonical deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p tmp/portfolio-fund-attribution/production
          node --experimental-strip-types scripts/verify-release-provenance.ts \
            --release-sha="$RELEASE_SHA" \
            --branch=main \
            --required-check=build \
            --output=tmp/portfolio-fund-attribution/production/release-provenance.json
          node --experimental-strip-types scripts/verify-vercel-deployment.ts \
            --deployment-url="$PRODUCTION_URL" \
            --expected-sha="$RELEASE_SHA" \
            --expected-project-id="$EXPECTED_VERCEL_PROJECT_ID" \
            --expected-github-repository-id="$EXPECTED_GITHUB_REPOSITORY_ID" \
            --output=tmp/portfolio-fund-attribution/production/canonical-deployment.json

      - name: Verify immutable attribution artifacts
        shell: bash
        run: |
          for artifact in "$MANIFEST_PATH" "$APPROVAL_PATH" "$PRODUCTION_SNAPSHOT_PATH" "$SEED_MANIFEST_PATH"; do
            git ls-files --error-unmatch -- "$artifact" >/dev/null
            git diff --quiet HEAD -- "$artifact" || { echo "::error::$artifact differs from the committed release."; exit 1; }
          done
          npm run portfolio:fund-attribution:apply -- \
            --manifest="$MANIFEST_PATH" \
            --manifest-sha256="$MANIFEST_SHA256" \
            --production-snapshot="$PRODUCTION_SNAPSHOT_PATH" \
            --approval="$APPROVAL_PATH" \
            --approval-sha256="$APPROVAL_SHA256" \
            --validate-only=true \
            | tee tmp/portfolio-fund-attribution/production/artifact-validation.json

      - name: Prove staged schema and exact production target
        shell: bash
        run: |
          set -o pipefail
          npm run db:generate
          npx prisma validate
          node --experimental-strip-types scripts/assert-database-target.ts
          npx prisma migrate status 2>&1 | tee tmp/portfolio-fund-attribution/production/migrate-status.log
          npx prisma migrate diff --from-schema=prisma/schema.prisma --to-config-datasource --exit-code 2>&1 \
            | tee tmp/portfolio-fund-attribution/production/schema-drift.log

      - name: Dry-run all reviewed mutations against fresh production state
        shell: bash
        run: |
          set -o pipefail
          npm run portfolio:fund-attribution:apply -- \
            --manifest="$MANIFEST_PATH" \
            --manifest-sha256="$MANIFEST_SHA256" \
            --production-snapshot="$PRODUCTION_SNAPSHOT_PATH" \
            --approval="$APPROVAL_PATH" \
            --approval-sha256="$APPROVAL_SHA256" \
            2>&1 | tee tmp/portfolio-fund-attribution/production/dry-run.log

      - name: Prove cache revalidation readiness
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors \
            --request GET --header "Authorization: Bearer $REVALIDATE_TOKEN" "$REVALIDATE_URL" \
            > tmp/portfolio-fund-attribution/production/cache-preflight.json
          node -e 'const fs=require("node:fs"); const value=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (value.ready !== true) throw new Error("Cache preflight failed")' \
            tmp/portfolio-fund-attribution/production/cache-preflight.json

      - name: Final release, schema, target, and artifact recheck
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node --experimental-strip-types scripts/verify-release-provenance.ts \
            --release-sha="$RELEASE_SHA" --branch=main --required-check=build \
            --output=tmp/portfolio-fund-attribution/production/release-provenance-before-write.json
          node --experimental-strip-types scripts/verify-vercel-deployment.ts \
            --deployment-url="$PRODUCTION_URL" --expected-sha="$RELEASE_SHA" \
            --expected-project-id="$EXPECTED_VERCEL_PROJECT_ID" \
            --expected-github-repository-id="$EXPECTED_GITHUB_REPOSITORY_ID" \
            --output=tmp/portfolio-fund-attribution/production/canonical-deployment-before-write.json
          node --experimental-strip-types scripts/assert-database-target.ts
          npx prisma migrate status 2>&1 | tee tmp/portfolio-fund-attribution/production/migrate-status-before-write.log
          npx prisma migrate diff --from-schema=prisma/schema.prisma --to-config-datasource --exit-code 2>&1 \
            | tee tmp/portfolio-fund-attribution/production/schema-drift-before-write.log
          git diff --quiet HEAD -- "$MANIFEST_PATH" "$APPROVAL_PATH" "$PRODUCTION_SNAPSHOT_PATH" "$SEED_MANIFEST_PATH"

      - name: Apply reviewed portfolio fund attribution transactionally
        id: apply
        env:
          PROTECTED_PRODUCTION_WRITE_APPROVAL_SHA256: ${{ inputs.approval_sha256 }}
        shell: bash
        run: |
          set -o pipefail
          npm run portfolio:fund-attribution:apply -- \
            --manifest="$MANIFEST_PATH" \
            --manifest-sha256="$MANIFEST_SHA256" \
            --production-snapshot="$PRODUCTION_SNAPSHOT_PATH" \
            --approval="$APPROVAL_PATH" \
            --approval-sha256="$APPROVAL_SHA256" \
            --apply=true \
            --write-token=APPLY_REVIEWED_PORTFOLIO_FUND_ATTRIBUTION \
            --receipt=tmp/portfolio-fund-attribution/production/apply-receipt.json \
            2>&1 | tee tmp/portfolio-fund-attribution/production/apply.log

      - name: Revalidate public portfolio caches
        if: steps.apply.outcome == 'success'
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors \
            --request POST --header "Authorization: Bearer $REVALIDATE_TOKEN" "$REVALIDATE_URL" \
            > tmp/portfolio-fund-attribution/production/cache-revalidation.json
          node -e 'const fs=require("node:fs"); const value=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (value.revalidated !== true) throw new Error("Cache revalidation failed")' \
            tmp/portfolio-fund-attribution/production/cache-revalidation.json

      - name: Verify public attribution samples and portfolio page
        if: steps.apply.outcome == 'success'
        shell: bash
        run: |
          receipt_sha="$(jq -r '.receiptSha256' tmp/portfolio-fund-attribution/production/apply-receipt.json)"
          npx tsx scripts/verify-portfolio-fund-attribution-release.ts \
            --manifest="$MANIFEST_PATH" \
            --approval="$APPROVAL_PATH" \
            --receipt=tmp/portfolio-fund-attribution/production/apply-receipt.json \
            --manifest-sha256="$MANIFEST_SHA256" \
            --approval-sha256="$APPROVAL_SHA256" \
            --receipt-sha256="$receipt_sha" \
            --public-base-url="${PRODUCTION_URL}${PUBLIC_BASE_PATH}/" \
            --output=tmp/portfolio-fund-attribution/production/release-verification.json
          curl --fail-with-body --silent --show-error --max-time 30 "${PRODUCTION_URL}${PUBLIC_BASE_PATH}/portfolio" \
            > tmp/portfolio-fund-attribution/production/portfolio.html

      - name: Upload immutable attribution apply evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portfolio-fund-attribution-${{ inputs.manifest_sha256 }}-${{ inputs.release_sha }}-${{ github.run_id }}
          path: tmp/portfolio-fund-attribution/production/
          if-no-files-found: warn
          retention-days: 90
