name: TXNM staging model access

on:
  push:
    branches: [codex/txnm-staging-probe]
    paths: [".github/workflows/news-staging-access.yml"]

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/codex/txnm-staging-probe'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Check both restricted Responses API model grants
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const key = process.env.OPENAI_API_KEY?.trim();
          if (!key) throw new Error("The staging API key was not injected.");
          const errorCodes = new Set([
            "credit_balance_exhausted", "insufficient_quota", "billing_hard_limit_reached",
            "billing_not_active", "project_spend_limit_exceeded", "organization_spend_limit_exceeded",
            "organization_usage_limit_exceeded", "rate_limit_exceeded", "slow_down",
            "model_not_found", "invalid_api_key", "insufficient_permissions", "missing_scope",
          ]);
          const models = ["gpt-6-luna", "gpt-6.1-sol"];
          for (const model of models) {
            const response = await fetch("https://api.openai.com/v1/responses", {
              method: "POST",
              headers: { "Authorization": `Bearer ${key}`, "Content-Type": "application/json" },
              body: JSON.stringify({
                model, input: "Reply with OK.", store: false,
                max_output_tokens: 32, reasoning: { effort: "low" },
              }),
              signal: AbortSignal.timeout(45_000),
            });
            const body = await response.json().catch(() => null);
            const errorCode = [body?.error?.code, body?.error?.type].find((code) => errorCodes.has(code));
            console.log(JSON.stringify({
              model, httpStatus: response.status,
              result: response.ok ? "authorized" : (errorCode ?? "provider_error"),
            }));
            if (!response.ok) process.exitCode = 1;
          }
          NODE
